name: Idea
description: Something Plaincontrol could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation and what gets in the way, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working, if you have an idea.

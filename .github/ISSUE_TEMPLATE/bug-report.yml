name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 27.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plaincontrol version
      description: Finder › Applications › Plaincontrol › Get Info.
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      placeholder: the output of claude --version
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: The terminal you run Claude Code in, and whether it runs inside tmux.
      placeholder: iTerm2, no tmux
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        For a session that does not show up or has the wrong status: the useful part of this
        command's output, run in Terminal right after it happens. Plaincontrol never logs
        prompts, but the log can hold folder names; leave out what you would rather not share.
      placeholder: log show --last 5m --predicate 'subsystem == "io.github.martijnmul.plaincontrol"'
      render: text

name: Plaincontrol

options:
  bundleIdPrefix: io.github.martijnmul
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

packages:
  PlaincontrolCore:
    path: Packages/PlaincontrolCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Plaincontrol:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: PlaincontrolCore
        product: PlaincontrolCore
      - package: PlaincontrolCore
        product: PlaincontrolHooks
      # The hook command travels inside the app, next to its executable, so it is signed and
      # notarised with it. The Claude Code plugin finds it through a link the app keeps.
      - target: plaincontrol-hook
        copy:
          destination: executables
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.martijnmul.plaincontrol
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plaincontrol
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: To bring the terminal pane of a session to the front.
        ENABLE_HARDENED_RUNTIME: YES
        # App/AppIcon.icon, made for Icon Composer.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Lets the hardened runtime send Apple events, to control the terminal.
        CODE_SIGN_ENTITLEMENTS: App/Plaincontrol.entitlements
      configs:
        # The development build is a separate app, so it can run next to the release build.
        Debug:
          PRODUCT_NAME: Plaincontrol Dev
          PRODUCT_BUNDLE_IDENTIFIER: io.github.martijnmul.plaincontrol.dev
          INFOPLIST_KEY_CFBundleDisplayName: Plaincontrol Dev

  # The same command Swift Package Manager builds for `make hook`, built here to go in the app.
  plaincontrol-hook:
    type: tool
    platform: macOS
    sources: [Packages/PlaincontrolCore/Sources/plaincontrol-hook]
    dependencies:
      - package: PlaincontrolCore
        product: PlaincontrolHooks
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: plaincontrol-hook
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
